<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head (pageTitle='Drop Project - Error')}">
</head>

<body>

<div th:replace="~{layout/layout :: header}"></div>

<div class="container" style="max-width: 760px; margin-bottom: 65px">

    <h1 class="page-header">Error</h1>

    <div class="alert alert-danger">
        <strong th:text="${status}">500</strong> <span th:text="${error}">Internal Server Error</span>
    </div>

    <p th:if="${status == 404}">The page that you requested does not exist.</p>
    <p th:unless="${status == 404}">
        Something went wrong while showing this page. If it keeps happening, report it to
        <a th:href="'mailto:' + ${adminEmail}" th:text="${adminEmail}">the administrator</a>.
    </p>

    <p>
        <a th:href="@{/}" class="btn btn-primary">Go to the homepage</a>
    </p>

    <p><small class="text-muted" th:text="${timestamp}"></small></p>

</div>

<div th:replace="~{layout/layout :: footer}"></div>

</body>
</html>
