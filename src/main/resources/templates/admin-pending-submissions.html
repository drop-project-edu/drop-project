<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head (pageTitle='Drop Project - Pending Submissions')}">
</head>

<body>

<div th:replace="~{layout/layout :: header}"></div>

<div class="container" style="max-width: 760px">

    <h1 class="page-header">Pending submissions</h1>

    <div th:if="${message}">
        <div class="alert alert-info" th:text="${message}"/>
    </div>

    <div th:if="${error}">
        <div class="alert alert-danger" th:text="${error}"/>
    </div>

    <p>&nbsp;</p>

    <!--/*@thymesVar id="pendingSubmissions" type="java.util.ArrayList<org.dropproject.dao.Submission>"*/-->
    <table class="table">
        <thead>
        <tr>
            <th>Students</th>
            <th>Assignment</th>
            <th>Submission Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="submission : ${pendingSubmissions}">
            <td th:text="${submission.group.authorsIdStr(', ')}" th:title="${submission.group.authorsNameStr()}"></td>
            <td th:text="${submission.assignmentId}"></td>
            <td th:text="${#dates.format(submission.submissionDate, 'dd/MMM HH:mm:ss')}"></td>
            <td th:text="${submission.getStatus().description}"></td>
            <td>
                <form class="inline" method="post" th:action="@{'/admin/abort/' + ${submission.id}}">
                    <input type="submit" value="Abort" class="btn btn-default btn-xs"/>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h1 class="page-header">Orphaned processes</h1>

    <!--/*@thymesVar id="orphanedProcesses" type="java.util.ArrayList<org.dropproject.data.OrphanedProcess>"*/-->
    <table class="table" th:if="${!orphanedProcesses.isEmpty()}">
        <thead>
        <tr>
            <th>PID</th>
            <th>Submission</th>
            <th>Running for</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="orphanedProcess : ${orphanedProcesses}">
            <td th:text="${orphanedProcess.pid}"></td>
            <td><a th:href="@{'/buildReport/' + ${orphanedProcess.submissionId}}" th:text="${orphanedProcess.submissionId}"></a></td>
            <td th:text="${orphanedProcess.runningForSeconds} + ' s'"></td>
            <td>
                <form class="inline" method="post" th:action="@{'/admin/killProcess/' + ${orphanedProcess.pid}}">
                    <input type="submit" value="Kill" class="btn btn-default btn-xs"
                           data-toggle="confirmation" data-title="Kill process"
                           data-content="Are you sure you want to kill this process?"
                           data-btn-ok-label="Yes, kill it!" data-btn-cancel-label="Cancel"/>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${orphanedProcesses.isEmpty()}">No orphaned processes found.</p>

</div>

<div th:replace="~{layout/layout :: footer}"></div>

</body>
</html>
