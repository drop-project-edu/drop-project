name: Run Tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'
      - name: Check maven version
        run: mvn --version
      - name: Set DP_M2_HOME
        run: echo "DP_M2_HOME=$(mvn -v | grep 'Maven home' | cut -d' ' -f3-)" >> $GITHUB_ENV
      - name: Build with Maven
        env:
          DP_MVN_REPO: ~/.m2
          DP_SAMPLE_JAVA_ASSIGNMENT_PRIVATE_KEY: ${{ secrets.DP_SAMPLE_JAVA_ASSIGNMENT_PRIVATE_KEY }}
          DP_SAMPLE_JAVA_SUBMISSION_PRIVATE_KEY: ${{ secrets.DP_SAMPLE_JAVA_SUBMISSION_PRIVATE_KEY }}
        # secrets are not available to workflows triggered by pull requests from forks; in that case
        # run only the fast suite (which needs no ssh keys) and skip the jacoco coverage gate,
        # since it is calibrated for the full suite
        run: |
          if [ -n "$DP_SAMPLE_JAVA_ASSIGNMENT_PRIVATE_KEY" ]; then
            mvn --batch-mode --update-snapshots verify
          else
            echo "Test ssh keys not available (pull request from a fork?) - running the fast suite only"
            mvn --batch-mode --update-snapshots test -Pfast
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          fail_ci_if_error: false

